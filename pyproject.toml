[project]
name = "arcgis-pro-mcp"
version = "1.1.2"
description = "ArcGIS Pro MCP hardened source: authenticated read-only defaults; legacy Python transport retired"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Pisut Nakmuenwai" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["arcgis", "arcgis-pro", "gis", "mcp", "model-context-protocol", "arcpy"]
dependencies = ["mcp>=1.6.0,<2", "pydantic>=2.0"]

[project.urls]
Homepage = "https://github.com/Knight60/ArcGIS-Pro-MCP"
Repository = "https://github.com/Knight60/ArcGIS-Pro-MCP"
Issues = "https://github.com/Knight60/ArcGIS-Pro-MCP/issues"

[project.scripts]
arcgis-pro-mcp = "arcgis_pro_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcgis_pro_mcp"]

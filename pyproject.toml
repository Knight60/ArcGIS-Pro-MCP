[project]
name = "arcgis-pro-mcp"
version = "0.2.0"
description = "MCP server that lets AI assistants (Claude Code, Codex, Gemini CLI) drive a live ArcGIS Pro session: 110 tools plus full arcpy access"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.6.0", "pydantic>=2.0"]

[project.scripts]
arcgis-pro-mcp = "arcgis_pro_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcgis_pro_mcp"]
